[project]
name = "layer-api"
version = "0.1.0"
description = "Layer backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=4.0,<6",
    "composio>=0.22,<1",
    "email-validator>=2.0,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "PyJWT>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
